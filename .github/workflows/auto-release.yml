name: Auto Tag on PR Merge

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.11.31). Leave empty to use version from provider/go.mod'
        required: false
        type: string

jobs:
  create_tag:
    # Run if: (1) PR was merged with needs-release label, OR (2) manually triggered
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       (contains(github.event.pull_request.labels.*.name, 'needs-release/patch') ||
        contains(github.event.pull_request.labels.*.name, 'needs-release/minor') ||
        contains(github.event.pull_request.labels.*.name, 'needs-release/major')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tags
          token: ${{ secrets.PULUMI_GPAT }}

      - name: Get Terraform provider version
        id: get_version
        run: |
          # Use manual input version if provided, otherwise extract from provider/go.mod
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manually specified version: $VERSION"
          else
            # Extract version from provider/go.mod, ignoring comments and replace directives
            VERSION=$(grep -v '^//' provider/go.mod | grep -v '^replace' | grep "github.com/duplocloud/terraform-provider-duplocloud" | awk '{print $2}' | sed 's/^v//')
            echo "Extracted version from provider/go.mod: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Creating tag v$VERSION"

          # Set up git identity for GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag message
          MESSAGE="Release v$VERSION - Synchronized with terraform-provider-duplocloud v$VERSION

          This release was triggered by PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})
          See: ${{ github.event.pull_request.html_url }}"

          # Create and push tag exactly like manual command
          git tag -a "v$VERSION" -m "$MESSAGE"
          git push origin "v$VERSION"

          echo "Tag v$VERSION pushed successfully."

          # Verify the tag was pushed
          if git ls-remote --tags origin | grep -q "refs/tags/v$VERSION"; then
            echo "✓ Tag v$VERSION successfully pushed to remote"
            echo "✓ Release workflow will be triggered automatically"
          else
            echo "ERROR: Tag not found on remote!"
            exit 1
          fi
