name: Auto Tag on PR Merge

on:
  pull_request:
    types: [closed]

jobs:
  create_tag:
    # Only run this job if the PR was merged (not just closed) and had the needs-release label
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'needs-release/patch') ||
       contains(github.event.pull_request.labels.*.name, 'needs-release/minor') ||
       contains(github.event.pull_request.labels.*.name, 'needs-release/major'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for tags
      
      - name: Get Terraform provider version
        id: get_version
        run: |
          # Extract version from provider/go.mod, ignoring comments and replace directives
          VERSION=$(grep -v '^//' provider/go.mod | grep -v '^replace' | grep "github.com/duplocloud/terraform-provider-duplocloud" | awk '{print $2}' | sed 's/^v//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Creating tag v$VERSION"
          
          # Set up git identity for GitHub Actions bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create tag message
          MESSAGE="Release v$VERSION - Synchronized with terraform-provider-duplocloud v$VERSION

          This release was triggered by PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})
          See: ${{ github.event.pull_request.html_url }}"
          
          # Create and push tag
          git tag -a "v$VERSION" -m "$MESSAGE"
          git push origin "v$VERSION"
